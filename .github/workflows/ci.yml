name: CI
"on": [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Ruff
        run: |
          pip install "ruff==0.16.4"
          ruff check tests/
          ruff format --check tests/
      - name: clang-format
        run: clang-format --dry-run --Werror tests/zfs_native_api.c
      - name: zig fmt
        run: zig fmt --check build.zig src
      - name: zig build check
        run: zig build check
      - name: zig build test
        run: zig build test --summary all
      - name: build
        run: zig build -Doptimize=ReleaseSafe
      - name: python tests
        run: python3 -m unittest discover -s tests -v
      - name: Reproducibility check
        run: |
          set -euo pipefail
          cp zig-out/bin/fslocate /tmp/fslocate-first
          zig build -Doptimize=ReleaseSafe --prefix /tmp/fslocate-repro --cache-dir /tmp/fslocate-repro-cache
          cmp /tmp/fslocate-first /tmp/fslocate-repro/bin/fslocate
          file zig-out/bin/fslocate | grep -E "pie executable|stripped"
      - name: Version consistency
        run: |
          python3 - <<'PY'
          import re, pathlib
          py = pathlib.Path("pyproject.toml").read_text()
          main = pathlib.Path("src/main.zig").read_text()
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          security = pathlib.Path("SECURITY.md").read_text()
          v_py = re.search(r'^version = "([^"]+)"', py, re.M).group(1)
          v_zig = re.search(r'const version = "([^"]+)";', main).group(1)
          assert v_py == v_zig, (v_py, v_zig)
          assert f"## [{v_py}]" in changelog
          assert f"{'.'.join(v_py.split('.')[:2])}.x (current)" in security
          for lit in re.findall(r'"version":"([^"]+)"', main): assert lit == v_zig, lit
          print("versions agree:", v_py)
          PY
